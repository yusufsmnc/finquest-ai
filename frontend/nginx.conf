# nginx config for the compiled Flutter web bundle.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Container healthcheck target — no logging, no filesystem hit.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback: Flutter web routes are client-side, so any unknown path
    # must return index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable — cache them hard.
    location ~* \.(?:js|wasm|css|png|jpg|jpeg|gif|svg|woff2?|ttf|json)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ...but never cache the entry point or the service worker, otherwise a
    # redeploy keeps serving the previous build to returning users.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json
                      application/wasm image/svg+xml;
    gzip_min_length   1024;

    # Don't advertise the nginx version.
    server_tokens off;
}
