# ── Tier 2: FastAPI backend ────────────────────────────────────────────────
# The point of this file: the image contains ZERO environment-specific values.
# Every setting arrives at runtime from the ConfigMap (non-secret) or the
# Secret (credentials + AI key). Rebuild nothing to change an environment.
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/part-of: finquest
    app.kubernetes.io/component: backend
spec:
  # LoadBalancer: the BROWSER calls this API directly — the compiled Flutter JS
  # runs on the user's machine, outside the cluster network — so it has to be
  # reachable from the host. Docker Desktop maps a LoadBalancer straight onto
  # localhost, so this lands on http://localhost:8000, exactly the URL that was
  # compiled into the frontend bundle. Faz 6 replaces this with an Ingress.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/part-of: finquest
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: finquest
    spec:
      # ── Faz 6c1: wait for the database before the app container starts ──
      # Without this the entrypoint runs `alembic upgrade head` against a
      # Postgres that may not be accepting connections yet, the process exits,
      # and Kubernetes restarts the pod until it succeeds. That produced exactly
      # one restart on every fresh deploy — harmless, but noise that would hide
      # a real crash. The init container turns the race into an ordered wait.
      #
      # postgres:16-alpine is used purely as a toolbox: it is the only image
      # here that ships pg_isready, and it is already in the local image store.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$POSTGRES_USER" -d "$DB_NAME"; do
                echo "waiting for postgres at $DB_HOST:$DB_PORT ..."
                sleep 2
              done
              echo "postgres is accepting connections"
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: finquest-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: finquest-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: finquest-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: finquest-secrets
                  key: POSTGRES_USER
      containers:
        - name: backend
          image: finquest-backend:local
          # The image is built locally and Docker Desktop's Kubernetes shares
          # that image store, so there is no registry to pull from. Without
          # IfNotPresent the kubelet would try Docker Hub → ImagePullBackOff.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            # Bulk-inject everything that needs no assembly. Keys the app does
            # not recognise are ignored (pydantic-settings extra="ignore").
            - configMapRef:
                name: finquest-config
            - secretRef:
                name: finquest-secrets
          env:
            # These four are declared explicitly — NOT because envFrom missed
            # them, but because $(VAR) expansion below can only reference names
            # present in this `env` list. envFrom values are not expandable.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: finquest-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finquest-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: finquest-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: finquest-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: finquest-config
                  key: DB_NAME
            # The connection string is COMPOSED here from the secret half and
            # the non-secret half, so the password exists in exactly one place
            # (the Secret) and never in a committed manifest.
            # `+psycopg` selects the psycopg 3 driver the backend ships with.
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
          # The entrypoint runs `alembic upgrade head` before uvicorn starts, so
          # migrations happen on pod startup. If Postgres is not up yet the pod
          # exits and Kubernetes restarts it until it succeeds — the startup
          # probe below gives that loop room without the liveness probe killing
          # a slow-but-healthy migration.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30   # up to ~150s for migrations + boot
          readinessProbe:
            # Gates Service traffic, and deliberately NOT an httpGet on /health.
            # /health answers from configuration alone — it never touches the
            # database — so with Postgres stopped it still returns 200 while
            # every real request 500s. A readiness probe that cannot fail is
            # worse than none: it looks like a guarantee and is not one.
            #
            # This opens a real connection and runs SELECT 1, using the psycopg
            # already installed in the image, so no rebuild is needed. The
            # `+psycopg` dialect suffix is SQLAlchemy's, not libpq's, hence the
            # replace. When the database goes away the pod goes NotReady and
            # drops out of the Service endpoints instead of serving errors.
            exec:
              command:
                - python
                - -c
                - 'import os, psycopg; psycopg.connect(os.environ["DATABASE_URL"].replace("+psycopg", ""), connect_timeout=3).execute("SELECT 1")'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # Restarts a wedged process. Stays on /health precisely because
            # /health ignores the database: liveness must answer "is this
            # process still working", not "is its dependency up". Pointing it
            # at the database would turn a Postgres outage into a crashloop
            # across every backend replica, which is the classic way to turn a
            # recoverable incident into an outage.
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
