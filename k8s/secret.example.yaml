# ── Secret TEMPLATE — placeholders only, safe to commit ────────────────────
#
# ⚠️  A Kubernetes Secret is base64-ENCODED, NOT encrypted. Anyone who can run
#     `kubectl get secret finquest-secrets -o yaml` can decode every value.
#     That is exactly why the filled-in twin (k8s/secret.yaml) is git-ignored
#     and this placeholder file is the only one that gets committed.
#
# To produce the real one:
#     sh k8s/scripts/gen-secret.sh                     # from the git-ignored ./.env
#     powershell -File k8s\scripts\gen-secret.ps1
#   or: cp k8s/secret.example.yaml k8s/secret.yaml  and fill it in by hand.
#
# `stringData` takes plain text and Kubernetes base64-encodes it for you — no
# manual `base64 -w0`, and no chance of encoding a stray trailing newline.
apiVersion: v1
kind: Secret
metadata:
  name: finquest-secrets
  labels:
    app.kubernetes.io/part-of: finquest
type: Opaque
stringData:
  # PostgreSQL credentials. The postgres pod initialises the database with
  # them; the backend assembles its DATABASE_URL from the same two values, so
  # there is exactly one source of truth.
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"

  # Token signing key. Generate a long random string:
  #   python -c "import secrets; print(secrets.token_urlsafe(48))"
  JWT_SECRET: "REPLACE_ME"

  # AI key — injected into the BACKEND ONLY. It must never reach the frontend:
  # Flutter web compiles to JavaScript that every visitor can read.
  # Empty is a valid state — the mentor then serves its pre-seeded static
  # messages and the app keeps working normally.
  OPENAI_API_KEY: ""
