# Alembic config. The DB URL is NOT stored here — env.py reads it from the
# environment (DATABASE_URL) so no connection string is hardcoded.
[alembic]
script_location = alembic
# Without an explicit separator Alembic warns and falls back to splitting
# prepend_sys_path on spaces, commas and colons.
path_separator = os
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
