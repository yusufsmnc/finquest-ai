name: backend-tests

# Hermetic lane, gate-able on merge: no network, no AI key, no cluster. The
# only external piece is a throwaway PostgreSQL service container, which is
# what makes the DB-backed tests worth running at all — SQLite would not
# exercise the migration or the real driver.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Not secrets: this database exists for the length of one job, is
          # reachable only from it, and holds nothing but test rows. Real
          # credentials come from a K8s Secret and never appear in a workflow.
          POSTGRES_USER: finquest
          POSTGRES_PASSWORD: finquest-ci
          POSTGRES_DB: finquest_test
        ports:
          - 5432:5432
        # Without the health check the first step would race the database boot.
        options: >-
          --health-cmd "pg_isready -U finquest -d finquest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://finquest:finquest-ci@localhost:5432/finquest_test
      # conftest.py picks this up and runs every test against the service
      # container instead of its local throwaway SQLite file.
      TEST_DATABASE_URL: postgresql+psycopg://finquest:finquest-ci@localhost:5432/finquest_test
      JWT_SECRET: ci-signing-key-not-a-real-secret
      # Deliberately empty: the mentor must resolve to its static fallback, so
      # the suite can never reach a paid endpoint.
      OPENAI_API_KEY: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the runtime image (python:3.12-slim), not a newer local venv.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify formatting
        # The version is pinned twice over: requirements-dev.txt installs it and
        # `required-version` in pyproject.toml refuses to run any other, so a
        # ruff upgrade can never silently reformat this check into a failure.
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Run migrations
        # Also the migration's own test: if a revision is broken or the history
        # has two heads, the job stops here rather than in a cluster.
        run: alembic upgrade head

      - name: Run tests
        run: pytest
